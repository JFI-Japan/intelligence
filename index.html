<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06C755">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>株式・投資の最新情報</title>
<style>
* { box-sizing: border-box; }
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #fff;
    -webkit-text-size-adjust: 100%;
}
body {
    overflow-x: hidden;
    padding-bottom: 92px;
}
.poster {
    position: relative;
    width: 100%;
    max-width: 1024px;
    margin: 0 auto;
}
.poster img {
    display: block;
    width: 100%;
    height: auto;
    border: 0;
    user-select: none;
    -webkit-user-drag: none;
}

/* 海报原有 LINE 区域 */
.poster-line-link {
    position: absolute;
    left: 4.5%;
    top: 84%;
    width: 91%;
    height: 12.5%;
    display: block;
    -webkit-tap-highlight-color: transparent;
}

/* 手机底部固定 CTA */
.mobile-cta {
    position: fixed;
    z-index: 9999;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,.97);
    border-top: 1px solid rgba(0,0,0,.08);
    box-shadow: 0 -4px 18px rgba(0,0,0,.10);
}

.mobile-cta a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 620px;
    min-height: 58px;
    margin: 0 auto;
    padding: 10px 20px;
    border-radius: 14px;
    background: #06C755;
    color: #fff;
    text-decoration: none;
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Yu Gothic", sans-serif;
    font-weight: 700;
    font-size: clamp(17px, 4.8vw, 21px);
    line-height: 1.25;
    box-shadow: 0 3px 10px rgba(0,0,0,.16);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

.mobile-cta a:active {
    transform: scale(.985);
    opacity: .92;
}

.cta-icon {
    width: 34px;
    height: 34px;
    margin-right: 10px;
    border-radius: 50%;
    background: #fff;
    color: #06C755;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex: 0 0 auto;
}

.cta-text {
    text-align: center;
}

.cta-sub {
    display: block;
    margin-top: 2px;
    font-size: 12px;
    font-weight: 500;
    opacity: .95;
}

@media (min-width: 701px) {
    body { padding-bottom: 0; }
    .mobile-cta { display: none; }
}

@media (max-width: 600px) {
    .poster { width: 100vw; }
}
</style>
</head>
<body>

<main class="poster">
    <img src="poster.png" alt="株式・投資の最新情報" loading="eager">

    <!-- 海报底部 LINE 区域也可以点击 -->
    <a
        class="poster-line-link"
        href="https://line.me/R/oaMessage/%40608blpoi"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="LINEで連絡する"></a>
</main>

<!-- 手机端始终可见的固定 LINE 按钮 -->
<div class="mobile-cta">
    <a
        href="https://line.me/R/oaMessage/%40608blpoi"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="LINEで無料情報を受け取る">
        <span class="cta-icon">LINE</span>
        <span class="cta-text">
            LINEで最新の投資情報を受け取る
            <span class="cta-sub">タップしてお気軽にご連絡ください</span>
        </span>
    </a>
</div>

</body>
</html>
